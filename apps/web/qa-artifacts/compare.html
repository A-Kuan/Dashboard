<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <style>
      * { box-sizing: border-box; }
      html, body { width: 3360px; height: 945px; margin: 0; overflow: hidden; background: #111827; }
      main { display: grid; grid-template-columns: 1680px 1680px; }
      figure { position: relative; width: 1680px; height: 945px; margin: 0; }
      img { display: block; width: 1680px; height: 945px; object-fit: cover; }
      figcaption { position: absolute; top: 8px; left: 8px; padding: 5px 9px; color: white; background: rgba(15,23,42,.78); border-radius: 4px; font: 13px system-ui; z-index: 2; }
    </style>
  </head>
  <body>
    <main>
      <figure><figcaption>视觉原稿</figcaption><img src="../public/references/01-default-collapsed.png" alt="视觉原稿" /></figure>
      <figure><figcaption>当前实现</figcaption><img src="./implementation-default.png" alt="当前实现" /></figure>
    </main>
  </body>
</html>
