name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-build:
    name: Unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json

      - name: Install API dependencies
        working-directory: apps/api
        run: npm ci

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Test API
        working-directory: apps/api
        run: npm test

      - name: Test and build web application
        working-directory: apps/web
        run: |
          npm run test:unit
          npm run build
          npm run test:sites

      - name: Validate protected API release plan
        env:
          API_DEPLOY_DRY_RUN: 1
          API_DEPLOY_ALLOW_NON_MAIN: 1
        run: |
          bash -n deploy/release-api.sh
          bash -n deploy/run-api-restore-drill.sh
          bash -n apps/api/scripts/run-offsite-restore-drill.sh
          bash deploy/release-api.sh HEAD

  browser-regression:
    name: Isolated browser regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json

      - name: Install API dependencies
        working-directory: apps/api
        run: npm ci

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install Chromium and PostgreSQL client
        working-directory: apps/web
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Run isolated browser regression
        working-directory: apps/web
        env:
          E2E_PGHOST: 127.0.0.1
          E2E_PGPORT: 5432
          E2E_PGUSER: postgres
          E2E_PGPASSWORD: postgres
        run: npm run test:e2e

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_attempt }}
          path: apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7
